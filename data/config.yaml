# ============================================================
# SITE-WIDE CONFIG
# Fill these in as you set things up. Nothing breaks if a field
# is still a placeholder -- the site builds either way, it just
# shows "coming soon" style links until you fill them in.
# ============================================================

site:
  name: "RC Adventure Hub"
  tagline: "Real-world buying guides for RC cars, planes & boats"
  # Set this once you register a domain. Used for canonical URLs / sitemap.
  url: "https://rcadventurehub.com"
  description: >
    Independent buying guides, comparisons, and reviews for adult RC
    hobbyists -- cars, planes, and boats. We help you avoid buying the
    wrong RC vehicle for your skill level and budget.
  contact_email: "hello@example.com"

# ------------------------------------------------------------
# SEO / ANALYTICS (all free, no payment required -- but each still needs
# YOUR OWN Google account to set up, so Claude can't create these for you)
# ------------------------------------------------------------
# search_console_verification: paste ONLY the "content" value from Google
#   Search Console's HTML tag verification method -- Search Console ->
#   Settings -> Ownership verification -> HTML tag -> copy just the long
#   random string inside content="...", not the whole <meta> tag.
#   1. Go to https://search.google.com/search-console, add a property for
#      this site's URL (above).
#   2. Choose "HTML tag" verification, copy the content value here.
#   3. Tell me it's set -- I'll rebuild/redeploy and you can click Verify.
#   4. Submit sitemap.xml from Search Console -> Sitemaps once verified.
search_console_verification: ""

# ga4_measurement_id: your Google Analytics 4 property's Measurement ID
#   (looks like "G-XXXXXXXXXX"). Free, no payment method needed.
#   1. Go to https://analytics.google.com, create an account + a web
#      data stream for this site's URL.
#   2. Copy the "Measurement ID" shown for that stream.
#   3. Paste it here and tell me -- I'll wire in the tracking snippet.
#   Leave blank to skip analytics entirely; nothing breaks either way.
ga4_measurement_id: ""

# ------------------------------------------------------------
# GIFT SEASON SETTINGS
# ------------------------------------------------------------
# holiday_bar: slim announcement bar above the header on every page,
#   linking to /gifts/. Set enabled: false after the season.
# shipping_note: shown on gift pages. Keep it TRUE -- no made-up cutoff
#   dates. If you want to name a real date, put it in order_by_note after
#   checking Amazon.ca's published holiday delivery guidance yourself,
#   e.g. "Amazon.ca's posted last-order date for Christmas delivery is ...".
gifts:
  holiday_bar:
    enabled: true
    text: "Buying an RC for a teen or young adult? See the holiday gift guides"
    link_label: "Gift guides"
  shipping_note: >
    Delivery times stretch in December. Check the estimated delivery date
    on the Amazon.ca listing before you buy, and order early so the gift
    doesn't arrive late.
  order_by_note: ""

# ------------------------------------------------------------
# EMAIL SIGNUP (optional)
# ------------------------------------------------------------
# Leave `action` blank and NO signup form is rendered (nothing breaks).
# To turn it on: create a form in your email provider (Mailchimp,
# ConvertKit/Kit, Buttondown, MailerLite, etc.), copy its form "action"
# URL here, and set field_name to whatever its email input is called
# (Mailchimp: EMAIL; Buttondown: email; most others: email).
# Before enabling: update content/privacy-policy.md to say you collect
# email addresses, and DON'T put Amazon affiliate links inside the emails
# themselves (Amazon Associates rules) -- link to pages on this site.
email_signup:
  action: ""
  method: "post"
  field_name: "email"
  headline: "Get the gift-deadline reminder"
  blurb: "One or two emails before the holiday ordering window closes. Unsubscribe any time."
  button_label: "Remind me"

# ------------------------------------------------------------
# AFFILIATE PROGRAMS
# ------------------------------------------------------------
# amazon_tag: your Amazon Associates tracking ID, looks like "yourtag-20"
#   Get one at https://affiliate-program.amazon.com (free, instant account,
#   but Amazon requires 3 qualifying sales within 180 days or they close it,
#   so don't apply until the site has some real content and a little traffic).
#   Once you have it, every "Check Price on Amazon" button on the site
#   automatically becomes a valid affiliate link -- you only edit it here.
amazon_tag: "rcadventurehu-20"

# avantlink_id: your AvantLink affiliate/website ID. AvantLink is the
#   network that runs the Horizon Hobby and AMain Hobbies affiliate
#   programs (both pay 3-5%, 45/15-day cookies). Apply at
#   https://www.avantlink.com after you have a live site to submit.
avantlink_id: "YOUR-AVANTLINK-ID"

# shareasale_id: your ShareASale affiliate ID. Runs programs for brands
#   like Genstattu and Bezgar (6-15% commission, 60-day cookie). Apply at
#   https://www.shareasale.com/newsignup.cfm
shareasale_id: "YOUR-SHAREASALE-ID"
