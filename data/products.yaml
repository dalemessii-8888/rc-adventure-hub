# ============================================================
# PRODUCT / LINK CATALOG
# ============================================================
# Every product mentioned in an article should have an entry here.
# Articles reference products by their `id`. This is the ONLY place
# affiliate destinations are decided, so swapping a link, fixing a
# typo, or upgrading a product from an Amazon link to a higher-paying
# AvantLink link happens in exactly one place instead of hunting
# through every article that mentions it.
#
# merchant: one of "amazon" | "avantlink" | "shareasale" | "direct"
#   amazon     -> builds an Amazon search link with your amazon_tag
#   avantlink  -> builds a placeholder AvantLink click-through link
#                 (needs a real merchant_id once you're approved --
#                 see automation/AVANTLINK_SETUP.md)
#   shareasale -> same idea, for ShareASale-network brands
#   direct     -> plain non-affiliate link, used as a safe fallback
#                 while an application is pending
#
# image_url: shown on the product card. Hotlinked from the retailer's
#   own CDN (never re-hosted), so it always matches whatever the CTA
#   button links to.
#
# pending_product_url: for avantlink/shareasale products before you're
#   approved -- points the (non-monetized, clearly-labeled "pending")
#   link at the SPECIFIC real product page we sourced the photo from,
#   instead of a generic on-site search. Once AvantLink approves you,
#   replace it with a real tracking link in affiliate_url_override and
#   this field can go away.
# ============================================================

- id: traxxas-slash-4x4
  name: "Traxxas Slash 4X4"
  category: cars
  merchant: amazon
  # This is the "Ultimate" trim (higher-spec, no battery/charger included)
  # -- it's the only Slash 4X4 currently sold as a complete vehicle on
  # Amazon.ca. Cheaper standard RTR kits exist at hobby shops but aren't
  # on Amazon right now.
  affiliate_url_override: "https://www.amazon.ca/dp/B07JZXKHSM?tag=rcadventurehu-20"
  merchant_name: "Amazon"
  search_query: "Traxxas Slash 4X4 RTR"
  image_url: "https://m.media-amazon.com/images/I/611o54Yh6PL._AC_SX522_.jpg"
  blurb: "The default recommendation for a first hobby-grade RC car -- tough, widely supported, huge parts availability. Note: the Amazon listing is the higher-spec 'Ultimate' trim and doesn't include a battery or charger."

