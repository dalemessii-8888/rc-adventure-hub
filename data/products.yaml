# ============================================================
# PRODUCT / LINK CATALOG
# ============================================================
# Every product mentioned in an article should have an entry here.
# Articles reference products by their `id`. This is the ONLY place
# affiliate destinations are decided, so swapping a link, fixing a
# typo, or upgrading a product from an Amazon link to a higher-paying
# AvantLink link happens in exactly one place instead of hunting
# through every article that mentions it.
#
# merchant: one of "amazon" | "avantlink" | "shareasale" | "direct"
#   amazon     -> builds an Amazon search link with your amazon_tag
#   avantlink  -> builds a placeholder AvantLink click-through link
#                 (needs a real merchant_id once you're approved --
#                 see automation/AVANTLINK_SETUP.md)
#   shareasale -> same idea, for ShareASale-network brands
#   direct     -> plain non-affiliate link, used as a safe fallback
#                 while an application is pending
# ============================================================

